[project]
name = "image-analyzer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jim otis", email = "easmement@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "faiss-cpu>=1.15.1",
    "fastapi[standard]>=0.162.0",
    "imagehash>=4.3.2",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "scikit-image>=0.26.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "transformers>=5.22.1",
    "watchdog>=7.1.0",
]

[project.scripts]
image-analyzer = "image_analyzer:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
